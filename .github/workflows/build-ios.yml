name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: iOS bundle identifier
        required: true
        default: local.cineo.kanke.storm

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze application
        run: flutter analyze --no-pub
      - name: Run full regression suite
        run: flutter test --no-pub
      - name: Prepare iOS dependencies
        run: flutter build ios --release --no-codesign --config-only
      - name: Compile iPhone application
        env:
          APP_BUNDLE_ID: ${{ inputs.bundle_id || 'local.cineo.kanke.storm' }}
        run: |
          set -euo pipefail
          [[ "$APP_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]
          mkdir -p build/output
          xcodebuild -version | tee build/output/xcode-version.txt
          flutter --version | tee build/output/flutter-version.txt
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/output/xcodebuild.log
      - name: Package and validate unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/ios-device/Build/Products/Release-iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../output/Cineo-Kanke-Storm-unsigned.ipa Payload)
          python3 tool/validate_ipa.py build/output/Cineo-Kanke-Storm-unsigned.ipa
          shasum -a 256 build/output/*.ipa > build/output/SHA256SUMS.txt
          printf '%s\n' 'Unsigned iOS app; sign with your own Apple signing method before installing.' > build/output/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cineo-Kanke-Storm-iOS-${{ github.run_number }}
          path: |
            build/output/*.ipa
            build/output/SHA256SUMS.txt
            build/output/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cineo-iOS-logs-${{ github.run_number }}
          path: build/output/*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Save compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cineo-iOS-compiler-${{ github.run_number }}
          path: build/output/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
