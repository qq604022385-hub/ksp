name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle identifier
        required: true
        default: local.kanke.player
      signed:
        description: Sign with certificate/profile from repository secrets
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths-ignore: ['**/*.md', 'Research/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate source bundle
        run: python3 Scripts/validate_source.py
      - name: Run protocol and model tests
        run: swift test --package-path Packages/KankeCore
      - name: Build simulator app
        env:
          APP_BUNDLE_ID: ${{ inputs.bundle_id || 'local.kanke.player' }}
        run: |
          set -o pipefail
          xcodebuild -project Kanke.xcodeproj -scheme Kanke -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" build | tee build-simulator.log
      - name: Archive iPhone app without signing
        env:
          APP_BUNDLE_ID: ${{ inputs.bundle_id || 'local.kanke.player' }}
        run: |
          set -o pipefail
          xcodebuild -project Kanke.xcodeproj -scheme Kanke -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device -archivePath build/Kanke.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" archive | tee build-device.log
      - name: Optionally sign for registered devices
        if: ${{ inputs.signed == true }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: bash Scripts/sign_app.sh build/Kanke.xcarchive/Products/Applications/Kanke.app
      - name: Package IPA
        env:
          SIGNED: ${{ inputs.signed == true && 'true' || 'false' }}
        run: bash Scripts/package_ipa.sh build/Kanke.xcarchive/Products/Applications/Kanke.app "$SIGNED"
      - uses: actions/upload-artifact@v4
        with:
          name: Kanke-iOS-${{ github.run_number }}
          path: |
            build/output/*.ipa
            build/output/BUILD-INFO.txt
            build/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kanke-build-logs-${{ github.run_number }}
          path: '*build*.log'
          if-no-files-found: ignore
          retention-days: 7
